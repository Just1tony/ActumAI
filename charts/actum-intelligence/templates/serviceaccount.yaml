{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "actum-intelligence.serviceAccountName" . }}
  labels:
    {{- include "actum-intelligence.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# API access is unnecessary for a pure inference server — the pod never
# calls the Kubernetes API — so automountServiceAccountToken defaults to
# false in values.yaml, closing off a common lateral-movement vector if the
# inference container were ever compromised via a malicious payload/plugin.
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
