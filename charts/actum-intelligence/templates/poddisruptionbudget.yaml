{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "actum-intelligence.fullname" . }}
  labels:
    {{- include "actum-intelligence.labels" . | nindent 4 }}
spec:
  # Guarantees that voluntary disruptions (node drains during cluster
  # upgrades, cluster-autoscaler consolidation, etc.) never take the
  # service below a safe minimum of ready, GPU-warmed replicas — critical
  # given that a replacement replica takes minutes to load model weights
  # before it can serve traffic again.
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "actum-intelligence.selectorLabels" . | nindent 6 }}
{{- end }}
