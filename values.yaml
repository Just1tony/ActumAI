# ==============================================================================
# Actum Intelligence Platform — Production values.yaml
# ==============================================================================
# This file is the single source of truth for the deployed configuration of
# the vLLM inference service. Every value here is deliberately explicit
# (no implicit chart defaults hidden in templates) so that a platform
# operator can audit the full production posture from this one file.
# ==============================================================================

replicaCount: 3

image:
  repository: registry.actum.ai/actum-intelligence/vllm-runtime
  tag: "0.6.3-cuda12.1"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: actum-registry-credentials

nameOverride: ""
fullnameOverride: ""

# ------------------------------------------------------------------------------
# vLLM model & serving configuration
# ------------------------------------------------------------------------------
# These values are rendered into container env vars and CLI args by
# templates/deployment.yaml. Changing the model here is sufficient to roll
# out a different model without touching any template.
vllm:
  model: "meta-llama/Meta-Llama-3.1-8B-Instruct"
  servedModelName: "actum-llama-3.1-8b"
  dtype: "bfloat16"
  maxModelLen: 8192
  gpuMemoryUtilization: "0.90"
  tensorParallelSize: 1
  pipelineParallelSize: 1
  maxNumSeqs: 256
  enablePrefixCaching: true
  swapSpaceGb: 4
  disableLogRequests: false
  trustRemoteCode: false
  quantization: ""            # e.g. "awq", "gptq"; empty = full precision
  apiKeySecretName: "actum-vllm-api-key"   # k8s Secret providing VLLM_API_KEY
  extraArgs: []                # additional raw CLI flags appended verbatim

# ------------------------------------------------------------------------------
# GPU / compute resource management
# ------------------------------------------------------------------------------
resources:
  requests:
    cpu: "4"
    memory: "16Gi"
    nvidia.com/gpu: 1
  limits:
    cpu: "8"
    memory: "32Gi"
    nvidia.com/gpu: 1

# Shared-memory volume size. vLLM/Ray use /dev/shm heavily for inter-process
# tensor exchange; the Kubernetes default (64Mi) is far too small and causes
# silent crashes under load, so this is explicitly sized.
shmSizeLimit: "8Gi"

# ------------------------------------------------------------------------------
# GPU node scheduling
# ------------------------------------------------------------------------------
nodeSelector:
  nvidia.com/gpu.present: "true"
  node.kubernetes.io/instance-type: "g5.2xlarge"

tolerations:
  - key: "nvidia.com/gpu"
    operator: "Exists"
    effect: "NoSchedule"
  - key: "actum.ai/dedicated-gpu-pool"
    operator: "Equal"
    value: "true"
    effect: "NoSchedule"

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: "kubernetes.io/hostname"
          labelSelector:
            matchExpressions:
              - key: "app.kubernetes.io/name"
                operator: In
                values:
                  - actum-intelligence

# ------------------------------------------------------------------------------
# Networking
# ------------------------------------------------------------------------------
service:
  type: ClusterIP
  port: 80
  targetPort: 8000
  annotations: {}

# ------------------------------------------------------------------------------
# Autoscaling
# ------------------------------------------------------------------------------
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetGPUUtilizationPercent: 70
  targetCPUUtilizationPercent: 75
  scaleDownStabilizationSeconds: 300
  scaleUpStabilizationSeconds: 30

# ------------------------------------------------------------------------------
# Health probes
# ------------------------------------------------------------------------------
probes:
  liveness:
    path: /health
    initialDelaySeconds: 120
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  readiness:
    path: /health
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  startup:
    path: /health
    periodSeconds: 10
    failureThreshold: 60    # up to 10 minutes for large model weights to load
    timeoutSeconds: 5

# ------------------------------------------------------------------------------
# Deployment / rollout behavior
# ------------------------------------------------------------------------------
restartPolicy: Always

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0   # never reduce serving capacity during a rollout

terminationGracePeriodSeconds: 90   # allow in-flight generations to drain

podDisruptionBudget:
  enabled: true
  minAvailable: 2

# ------------------------------------------------------------------------------
# Persistent Hugging Face model cache
# ------------------------------------------------------------------------------
modelCache:
  enabled: true
  storageClassName: "gp3-encrypted"
  accessMode: ReadWriteOnce
  size: "300Gi"
  mountPath: /data/hf-cache

# ------------------------------------------------------------------------------
# Security
# ------------------------------------------------------------------------------
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false   # vLLM writes compilation cache under /app
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  runAsUser: 10001

serviceAccount:
  create: true
  automountServiceAccountToken: false
  name: ""
  annotations: {}

# ------------------------------------------------------------------------------
# Observability
# ------------------------------------------------------------------------------
metrics:
  enabled: true
  path: /metrics
  port: 8000
  serviceMonitor:
    enabled: true
    interval: 15s
    scrapeTimeout: 10s
    namespace: "monitoring"
    labels:
      release: prometheus

# ------------------------------------------------------------------------------
# Extra environment variables (merged into the container spec verbatim)
# ------------------------------------------------------------------------------
extraEnv:
  - name: NCCL_DEBUG
    value: "WARN"
  - name: TOKENIZERS_PARALLELISM
    value: "false"

podAnnotations: {}
podLabels: {}

extraVolumes: []
extraVolumeMounts: []
