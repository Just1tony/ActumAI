{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "actum-intelligence.fullname" . }}
  labels:
    {{- include "actum-intelligence.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "actum-intelligence.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    # ------------------------------------------------------------------
    # Primary signal: real GPU compute utilization, not CPU. This metric
    # is NOT available from the stock Kubernetes metrics-server — it is
    # sourced from the NVIDIA DCGM Exporter's `DCGM_FI_DEV_GPU_UTIL` gauge,
    # scraped by Prometheus, and surfaced into the Kubernetes Custom
    # Metrics API via the Prometheus Adapter (see README §5 for the
    # required cluster-level wiring). This is the metric that actually
    # reflects inference load on a GPU-bound vLLM workload; CPU alone is a
    # poor proxy since the request-handling/tokenization path is cheap
    # relative to GPU-bound generation.
    # ------------------------------------------------------------------
    - type: Pods
      pods:
        metric:
          name: actum_vllm_gpu_utilization_percent
        target:
          type: AverageValue
          averageValue: {{ .Values.autoscaling.targetGPUUtilizationPercent | quote }}
    # ------------------------------------------------------------------
    # Secondary safety-net signal: standard CPU utilization, sourced from
    # metrics-server. Protects against request-queueing/tokenization
    # bottlenecks that would not necessarily show up as elevated GPU
    # utilization (e.g. very high concurrency of short prompts).
    # ------------------------------------------------------------------
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercent }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: {{ .Values.autoscaling.scaleUpStabilizationSeconds }}
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
        - type: Percent
          value: 100
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      # Scale-down is deliberately slow and conservative: each replica
      # holds an expensive, minutes-long GPU model load, so flapping
      # (scale down then immediately back up) wastes far more time and
      # cost than a slightly delayed scale-down does.
      stabilizationWindowSeconds: {{ .Values.autoscaling.scaleDownStabilizationSeconds }}
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
      selectPolicy: Min
{{- end }}
